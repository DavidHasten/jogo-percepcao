<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sensação e Percepção — Jogo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
  :root { --card:#ffffff; --accent:#06b6d4; --accent-dark:#0e7490; --accent2:#8b5cf6; --text:#1e1b2e; --muted:#6b7280; }
  * { box-sizing: border-box; }
  body, #app { margin: 0; font-family: 'Inter', -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  h1, h2, .badge, .btn { font-family: 'Space Grotesk', 'Inter', sans-serif; }
  #app {
    min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 24px 16px;
    background:
      radial-gradient(circle at 15% 15%, rgba(139,92,246,0.22), transparent 42%),
      radial-gradient(circle at 85% 25%, rgba(6,182,212,0.20), transparent 40%),
      radial-gradient(circle at 50% 90%, rgba(236,72,153,0.12), transparent 45%),
      linear-gradient(180deg, #0b0f21 0%, #1a1533 100%);
    background-attachment: fixed;
  }
  .card { position: relative; overflow: hidden; background: var(--card); border-radius: 20px; padding: 30px 22px 26px; max-width: 520px; width: 100%; min-height: 480px; box-shadow: 0 25px 60px rgba(0,0,0,0.45); text-align: center; animation: fadein 0.2s ease; display: flex; flex-direction: column; }
  .card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 6px; background: linear-gradient(90deg, #06b6d4, #8b5cf6, #ec4899); }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: translateY(0);} }
  h1 { font-size: 21px; font-weight: 700; color: var(--text); margin: 0 0 10px; line-height: 1.3; }
  h2 { font-size: 13.5px; font-weight: 600; color: var(--accent2); margin: 0 0 12px; text-transform: uppercase; letter-spacing: 0.06em; }
  p.lead { color: var(--muted); font-size: 14.5px; line-height: 1.5; margin-bottom: 18px; }
  .btn { display: inline-block; background: linear-gradient(135deg, #22d3ee, #0891b2); color: white; border: none; padding: 13px 22px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; margin: 5px; min-width: 110px; box-shadow: 0 4px 12px rgba(8,145,178,0.35); transition: transform 0.1s, box-shadow 0.15s, filter 0.15s; }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.35; cursor: default; }
  .btn.secondary { background: #eef0f6; color: var(--text); box-shadow: none; }
  .btn.secondary:hover { background: #e2e5f0; filter: none; }
  .topbar { height: 6px; background: #e9e7f5; border-radius: 999px; overflow: hidden; margin-bottom: 10px; }
  .topbar-fill { height: 100%; background: linear-gradient(90deg, #06b6d4, #8b5cf6); border-radius: 999px; width: 100%; }
  .progress { font-size: 11.5px; color: var(--muted); margin-bottom: 4px; text-align: left; font-weight: 500; }
  .stage-bars { display: flex; align-items: flex-end; justify-content: center; gap: 44px; margin: 16px 0 20px; background: #f6f5fc; border-radius: 16px; padding: 20px 16px 16px; height: 430px; box-shadow: inset 0 0 0 1px #e3e1f4; }
  .bar-wrap { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
  .bar { width: 54px; background: linear-gradient(180deg, #22d3ee, #6366f1); border-radius: 6px 6px 0 0; }
  .bar-placeholder { width: 54px; height: 8px; border: 2px dashed #a5a3c9; border-radius: 6px; }
  .bar-label { margin-top: 8px; font-weight: 700; color: var(--text); font-size: 15px; }
  .caption { font-size: 12.5px; color: var(--muted); margin: -2px 0 2px; }
  .btn-row { display: flex; justify-content: center; flex-wrap: wrap; margin-top: auto; }
  svg { max-width: 100%; max-height: 380px; height: auto; display: block; margin: 0 auto; }
  .fig-wrap { background: #f6f5fc; border-radius: 16px; padding: 14px; margin-bottom: 16px; min-height: 220px; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 0 1px #e3e1f4; }
  .dots-row { display: flex; justify-content: center; gap: 22px; }
  .dots-box { background: #f6f5fc; border-radius: 12px; padding: 8px; box-shadow: inset 0 0 0 1px #e3e1f4; }
  .dots-label { margin-top: 6px; font-weight: 700; color: var(--text); font-size: 14px; }
  .small { font-size: 11px; color: var(--muted); }
  .table-scroll { overflow-x: auto; margin: 10px -6px 4px; padding: 0 6px; }
  .score-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
  .score-table th { color: var(--muted); font-weight: 600; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.03em; padding: 6px 6px; border-bottom: 2px solid #e3e1f4; text-align: center; vertical-align: bottom; line-height: 1.25; }
  .score-table th.name-col, .score-table td.name-col { text-align: left; position: sticky; left: 0; background: #fff; padding-left: 8px; min-width: 110px; }
  .score-table td { padding: 7px 6px; border-bottom: 1px solid #f1f0fa; text-align: center; white-space: nowrap; }
  .score-table td.name-col { font-weight: 600; color: var(--text); white-space: normal; }
  .score-table .pcell b { display: block; font-size: 13px; color: var(--text); }
  .score-table .pcell span { display: block; font-size: 10.5px; color: var(--muted); margin-top: 1px; }
  .score-table tr.class-row td { background: #f6f5fc; border-bottom: 2px solid #e3e1f4; }
  .score-table tr.class-row td.name-col { background: #f6f5fc; color: var(--accent2); }
  .score-table tr:last-child td { border-bottom: none; }
  #qrbox { margin-top: 12px; display: flex; justify-content: center; }
  .badge { display: inline-block; background: linear-gradient(135deg, #ecfeff, #f3e8ff); color: #7c3aed; font-size: 12px; font-weight: 700; padding: 5px 12px; border-radius: 999px; margin-bottom: 10px; }
  .note { font-size: 12px; color: var(--muted); background: #f6f5fc; border-radius: 10px; padding: 10px 12px; margin-top: 14px; text-align: left; }
  .score-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 4px; border-bottom: 1px solid #f1f0fa; font-size: 14px; }
  .score-row b { color: var(--accent2); }
  .linklike { color: var(--accent2); font-size: 13px; text-decoration: underline; cursor: pointer; }
  .dots-loader { display: flex; justify-content: center; align-items: center; gap: 9px; flex: 1; }
  .dots-loader span { width: 13px; height: 13px; border-radius: 50%; animation: bounce 0.9s infinite ease-in-out; }
  .dots-loader span:nth-child(1) { background: #06b6d4; }
  .dots-loader span:nth-child(2) { background: #8b5cf6; animation-delay: 0.15s; }
  .dots-loader span:nth-child(3) { background: #ec4899; animation-delay: 0.3s; }
  @keyframes bounce { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; } 40% { transform: scale(1); opacity: 1; } }
  .stroop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: auto; }
  .stroop-swatch { width: 100%; height: 118px; border-radius: 16px; border: none; cursor: pointer; box-shadow: 0 5px 0 rgba(0,0,0,0.22), 0 8px 16px rgba(0,0,0,0.15); transition: transform 0.08s, box-shadow 0.08s; }
  .stroop-swatch:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,0.22), 0 2px 6px rgba(0,0,0,0.12); }
  .cb-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: auto; }
  .cb-num-btn { background: linear-gradient(135deg, #22d3ee, #6366f1); color: white; border: none; border-radius: 10px; padding: 10px 0; font-size: 13px; font-weight: 700; cursor: pointer; box-shadow: 0 3px 8px rgba(99,102,241,0.3); }
  .cb-num-btn:active { transform: scale(0.93); }
  .text-input { width: 100%; padding: 14px 16px; font-size: 16px; border-radius: 12px; border: 2px solid #e3e1f4; margin: 14px 0; font-family: 'Inter', sans-serif; }
  .text-input:focus { outline: none; border-color: var(--accent2); }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  const isPainel = new URLSearchParams(window.location.search).get("painel") === "1";
  const app = document.getElementById("app");

  // ================= CONFIGURAÇÃO DO SUPABASE =================
  // Cole aqui a URL e a chave "anon" (pública) do seu projeto Supabase.
  // Painel do Supabase: Project Settings → API.
  // NUNCA coloque a chave "service_role" aqui — só a "anon public".
  const SUPABASE_URL = "https://ysjhfxqlmwvazajxducd.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_-DjeOLfIqtvETWlHv1SYSw_pOfcjL7x";
  // Desligamos o gerenciamento de sessão de autenticação do Supabase: o jogo não usa
  // login de usuário, só a chave pública direto nas tabelas. Sem isso, o cliente tenta
  // acessar localStorage internamente — o que falha (e derruba o script inteiro) em
  // ambientes que bloqueiam localStorage, como o preview de artefato do Claude.
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
  });

  const sessionId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Math.random().toString(36).slice(2) + Date.now().toString(36));
  let studentName = "";
  let startedAt = 0;

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  function coin() { return Math.random() < 0.5; }
  function interleaveNoAdjacent(items, keyFn) {
    const groups = {};
    items.forEach((it) => { const k = keyFn(it); (groups[k] = groups[k] || []).push(it); });
    Object.keys(groups).forEach((k) => { groups[k] = shuffle(groups[k]); });
    const result = []; let lastKey = null;
    while (result.length < items.length) {
      let keys = Object.keys(groups).filter((k) => groups[k].length > 0 && k !== lastKey);
      if (keys.length === 0) keys = Object.keys(groups).filter((k) => groups[k].length > 0);
      keys.sort((a, b) => groups[b].length - groups[a].length);
      const maxLen = groups[keys[0]].length;
      const top = keys.filter((k) => groups[k].length === maxLen);
      const chosen = top[Math.floor(Math.random() * top.length)];
      result.push(groups[chosen].shift());
      lastKey = chosen;
    }
    return result;
  }
  // ---- Variedade das respostas certas ----
  // Antes o lado/ordem era sorteado rodada a rodada, sem controle, então a mesma resposta
  // certa podia cair várias vezes seguidas (e a pessoa acabava apertando o mesmo botão).
  // planSequence sorteia a ordem das rodadas E o lado em que cada uma aparece até a
  // sequência de respostas certas ficar variada.
  function maxRunOf(arr) {
    let best = 0, run = 0, prev;
    arr.forEach((x, i) => { run = i > 0 && x === prev ? run + 1 : 1; prev = x; if (run > best) best = run; });
    return best;
  }
  function maxCountOf(arr) {
    const c = {}; arr.forEach((x) => { c[x] = (c[x] || 0) + 1; });
    return Math.max(0, ...Object.values(c));
  }
  // answerFn(item, swap) -> resposta certa daquele item com aquele lado.
  // opts: maxRun (mesma resposta seguida), maxPerAnswer (quantas vezes uma resposta pode
  // aparecer no bloco), extraOk(itensEmOrdem) (restrição extra). Devolve [{item, swap}]
  // ou null se não achou nenhuma ordem que cumpra tudo (quem chama decide o plano B).
  function planSequence(items, answerFn, opts) {
    const o = Object.assign({ maxRun: 2, maxPerAnswer: Infinity, extraOk: null, tries: 30000 }, opts || {});
    for (let t = 0; t < o.tries; t++) {
      const order = shuffle(items).map((it) => ({ item: it, swap: coin() }));
      const answers = order.map((x) => answerFn(x.item, x.swap));
      if (maxRunOf(answers) > o.maxRun) continue;
      if (maxCountOf(answers) > o.maxPerAnswer) continue;
      if (o.extraOk && !o.extraOk(order.map((x) => x.item))) continue;
      return order;
    }
    return null;
  }
  function noAdjacentGroup(items) { return items.every((it, i) => i === 0 || it.group !== items[i - 1].group); }

  function frameSvg(w, h, content) {
    return `<svg viewBox="0 0 ${w} ${h}" width="100%"><rect x="1" y="1" width="${w - 2}" height="${h - 2}" fill="none" stroke="#ddd6f5" stroke-width="2" rx="10"/>${content}</svg>`;
  }

  function render(html) { app.innerHTML = html; }
  function attach(id, fn) { document.getElementById(id).addEventListener("click", fn); }
  const responses = { weber: [], numerosity: [], illusions: [] };
  let globalOffset = 0;

  const MINI_LOADING_MS = 500;
  function miniLoading(onDone) {
    render(`<div class="card"><div class="dots-loader"><span></span><span></span><span></span></div></div>`);
    setTimeout(onDone, MINI_LOADING_MS);
  }

  // ================= DEFINIÇÕES: TAMANHO (Weber) — 12 rodadas =================
  const RATIO_MODERADA = 1.15, RATIO_DIFICIL = 1.025;
  const bases = [{ nome: "baixa", px: 50 }, { nome: "média", px: 110 }, { nome: "alta", px: 200 }, { nome: "muito_alta", px: 300 }];
  let weberPairs = [];
  bases.forEach((b) => {
    weberPairs.push({ id: `w_${b.nome}_moderada`, group: b.nome, a: b.px, b: Math.round(b.px * RATIO_MODERADA), correctType: "diferente" });
    weberPairs.push({ id: `w_${b.nome}_dificil`, group: b.nome, a: b.px, b: Math.round(b.px * RATIO_DIFICIL), correctType: "diferente" });
    weberPairs.push({ id: `w_${b.nome}_igual`, group: b.nome, a: b.px, b: b.px, correctType: "igual" });
  });
  // 8 rodadas "diferente" e 4 "igual": a ordem é sorteada pra nunca repetir a mesma resposta
  // certa mais de 3 vezes seguidas (com 2 sobravam só 15 padrões possíveis, fáceis de
  // adivinhar) e nunca repetir a mesma base em rodadas vizinhas.
  (function () {
    const plan = planSequence(weberPairs, (p) => p.correctType, { maxRun: 3, extraOk: noAdjacentGroup, tries: 60000 });
    weberPairs = plan ? plan.map((x) => x.item) : interleaveNoAdjacent(weberPairs, (x) => x.group);
  })();
  const EXPOSICAO_BARRAS_MS = 400;

  // ================= DEFINIÇÕES: QUANTIDADE — 12 rodadas =================
  const NUM_MODERADA = 1.3, NUM_DIFICIL = 1.08;
  const numBases = [8, 20, 35, 50];
  let numerosityPairs = [];
  numBases.forEach((n) => {
    numerosityPairs.push({ id: `n_${n}_moderada`, group: `${n}`, a: n, b: Math.round(n * NUM_MODERADA) });
    numerosityPairs.push({ id: `n_${n}_dificil`, group: `${n}`, a: n, b: Math.round(n * NUM_DIFICIL) });
    numerosityPairs.push({ id: `n_${n}_igual`, group: `${n}`, a: n, b: n });
  });
  // Resposta certa: "igual" ou o lado (A/B) onde o grupo maior aparece. Lado e ordem são
  // planejados juntos: A e B no máximo 4 vezes cada, nunca a mesma resposta 3x seguidas.
  const ansNumerosity = (p, swap) => (p.a === p.b ? "igual" : (swap ? "A" : "B"));
  (function () {
    const plan = planSequence(numerosityPairs, ansNumerosity, { maxRun: 2, maxPerAnswer: 4, extraOk: noAdjacentGroup, tries: 60000 });
    numerosityPairs = plan ? plan.map((x) => ({ ...x.item, swap: x.swap })) : interleaveNoAdjacent(numerosityPairs, (x) => x.group);
  })();
  const EXPOSICAO_PONTOS_MS = 600;

  function dotPositions(n, w, h, r) {
    const cols = Math.max(1, Math.ceil(Math.sqrt((n * w) / h)));
    const rows = Math.ceil(n / cols);
    const cellW = w / cols, cellH = h / rows;
    const positions = []; let count = 0;
    for (let ry = 0; ry < rows && count < n; ry++) {
      for (let cx = 0; cx < cols && count < n; cx++) {
        const jx = (Math.random() - 0.5) * Math.max(0, cellW - 2 * r) * 0.7;
        const jy = (Math.random() - 0.5) * Math.max(0, cellH - 2 * r) * 0.7;
        positions.push({ x: cx * cellW + cellW / 2 + jx, y: ry * cellH + cellH / 2 + jy }); count++;
      }
    }
    return positions;
  }
  function dotsSVG(n, w, h) {
    const r = 6;
    const circles = dotPositions(n, w, h, r).map((p) => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${r}" fill="#22d3ee"/>`).join("");
    return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">${circles}</svg>`;
  }

  // ================= DEFINIÇÕES DAS ILUSÕES =================
  function comparativeSet5(type, base, ratioSmall, ratioBig) {
    return [
      { type, key: `${type}_igual`, valA: base, valB: base },
      { type, key: `${type}_A_pouco`, valA: Math.round(base * ratioSmall), valB: base },
      { type, key: `${type}_A_muito`, valA: Math.round(base * ratioBig), valB: base },
      { type, key: `${type}_B_pouco`, valA: base, valB: Math.round(base * ratioSmall) },
      { type, key: `${type}_B_muito`, valA: base, valB: Math.round(base * ratioBig) },
    ];
  }
  function ratioSet5(type, ratioSmall, ratioBig) {
    ratioSmall = ratioSmall || 1.06; ratioBig = ratioBig || 1.3;
    return [
      { type, key: `${type}_igual`, ratioA: 1, ratioB: 1 },
      { type, key: `${type}_A_pouco`, ratioA: ratioSmall, ratioB: 1 },
      { type, key: `${type}_A_muito`, ratioA: ratioBig, ratioB: 1 },
      { type, key: `${type}_B_pouco`, ratioA: 1, ratioB: ratioSmall },
      { type, key: `${type}_B_muito`, ratioA: 1, ratioB: ratioBig },
    ];
  }
  function comparativeSetAbs5(type, base, diffSmall, diffBig) {
    return [
      { type, key: `${type}_igual`, valA: base, valB: base },
      { type, key: `${type}_A_pouco`, valA: base + diffSmall, valB: base },
      { type, key: `${type}_A_muito`, valA: base + diffBig, valB: base },
      { type, key: `${type}_B_pouco`, valA: base, valB: base + diffSmall },
      { type, key: `${type}_B_muito`, valA: base, valB: base + diffBig },
    ];
  }
  function illusionShell(idx, total, titulo, figSvg, options, correctValue, done) {
    render(`<div class="card">${topProgress(globalOffset + idx + 1)}<div class="progress">Rodada ${idx + 1} de ${total}</div>
      <h1>${titulo}</h1>
      <div class="fig-wrap" id="illFig">${figSvg}</div>
      <div class="btn-row">${options.map((o, k) => `<button class="btn ${o.secondary ? "secondary" : ""}" id="opt${k}">${o.label}</button>`).join("")}</div>
    </div>`);
    options.forEach((o, k) => attach(`opt${k}`, () => done({ isCorrect: o.value === correctValue })));
  }
  // Exposição breve (some depois de um tempo) para uma ilusão específica: força
  // julgamento de memória, em vez de deixar a pessoa medir/comparar com calma.
  function illusionShellTimed(idx, total, titulo, figSvg, placeholderSvg, exposureMs, options, correctValue, done) {
    render(`<div class="card">${topProgress(globalOffset + idx + 1)}<div class="progress">Rodada ${idx + 1} de ${total}</div>
      <h1>${titulo}</h1><p class="caption">A figura vai sumir — responda pelo que você lembrar.</p>
      <div class="fig-wrap" id="illFig">${figSvg}</div>
      <div class="btn-row">${options.map((o, k) => `<button class="btn ${o.secondary ? "secondary" : ""}" id="opt${k}" disabled>${o.label}</button>`).join("")}</div>
    </div>`);
    setTimeout(() => {
      const fig = document.getElementById("illFig"); if (!fig) return;
      fig.innerHTML = placeholderSvg;
      options.forEach((o, k) => { const b = document.getElementById(`opt${k}`); if (b) b.disabled = false; });
    }, exposureMs);
    options.forEach((o, k) => attach(`opt${k}`, () => done({ isCorrect: o.value === correctValue })));
  }

  // Ilusão de Jastrow: duas formas em arco (tipo "fatia de rosca"), empilhadas uma
  // sobre a outra. A de baixo sempre parece maior que a de cima mesmo quando são do
  // mesmo tamanho, porque o cérebro compara a borda interna curta de uma com a borda
  // externa longa da outra. Efeito perceptivo mais forte e mais difícil de "driblar"
  // olhando com calma do que o Müller-Lyer — ótimo pra "bugar" a sensação de quem joga.
  // Exibida por tempo limitado — ver illusionShellTimed.
  const JASTROW_EXPOSURE_MS = 900;
  function ringSectorPath(cx, cy, rInner, rOuter, startDeg, endDeg) {
    const pt = (r, deg) => { const rad = (deg * Math.PI) / 180; return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)]; };
    const [x1, y1] = pt(rOuter, startDeg), [x2, y2] = pt(rOuter, endDeg);
    const [x3, y3] = pt(rInner, endDeg), [x4, y4] = pt(rInner, startDeg);
    const large = endDeg - startDeg > 180 ? 1 : 0;
    return `M ${x1} ${y1} A ${rOuter} ${rOuter} 0 ${large} 1 ${x2} ${y2} L ${x3} ${y3} A ${rInner} ${rInner} 0 ${large} 0 ${x4} ${y4} Z`;
  }
  function renderJastrow(idx, total, round, done) {
    const base = 42 + Math.random() * 14; // 42 a 56 (com razão até 1,28 o maior fica < 72)
    const valA = round.ratioA * base, valB = round.ratioB * base;
    const swapPos = round.swap !== undefined ? round.swap : coin();
    const topVal = swapPos ? valB : valA; const botVal = swapPos ? valA : valB;
    const W = 290, H = 230, cx = W / 2;
    const startDeg = 200, endDeg = 340, innerRatio = 0.55;
    // Caixa real de cada forma: do topo do arco (cy - r) até o canto interno das pontas
    // (cy - innerRatio*sen(20°)*r). O conjunto (rótulo A + forma + vão + forma + rótulo B)
    // é medido e centralizado no quadro, então o "B" nunca sai da moldura.

  // Vários "cenários" de contexto sorteados por rodada (tamanho da base e número/tamanho

  }

  function renderContrasteSimultaneo(idx, total, round, done) {

  // ---- Observação de cena: 20 elementos (era 15), mudanças mais sutis: cor desloca

  const STROOP_COLORS = [{ name: "Vermelho", hex: "#dc2626" }, { name: "Azul", hex: "#2563eb" }, { name: "Verde", hex: "#16a34a" }, { name: "Amarelo", hex: "#ca8a04" }];

    }
    attempt();
  }

  // ================= MOTOR GENÉRICO DE BLOCO =================
  // planOpts (opcional): { answerFn, maxRun, maxPerAnswer } — ver planSequence. Com ele, a
  // ordem e o lado de cada rodada são escolhidos pra variar a resposta certa.
  function runSimpleBlock(variants, renderFn, onBlockDone, planOpts) {
    let seq = null;
    if (planOpts) {
      const plan = planSequence(variants, planOpts.answerFn, planOpts);
      if (plan) seq = plan.map((x) => ({ ...x.item, swap: x.swap }));
    }
    if (!seq) seq = shuffle(variants);
    let i = 0;
    function next() {
      if (i >= seq.length) { onBlockDone(); return; }
      const v = seq[i];
      renderFn(i, seq.length, v, (result) => {
        responses.illusions.push({ id: v.key, isCorrect: result.isCorrect });
        i++; miniLoading(next);
      });
    }
    next();
  }
  function runCegueiraBlock(onBlockDone) {
    const items = CB_KINDS.map((k, idx) => ({ kind: k, key: `cegueira_${idx}` }));
    const noTwoNone = (arr) => arr.every((it, j) => j === 0 || !(it.kind === "none" && arr[j - 1].kind === "none"));
    const plan = planSequence(items, (v) => (v.kind === "none" ? "nada" : "mudou"), { maxRun: 4, extraOk: noTwoNone });
    const seq = plan ? plan.map((x) => x.item) : shuffle(items);
    let i = 0;
    function next() {
      if (i >= seq.length) { onBlockDone(); return; }
      renderCegueiraMudanca(i, seq.length, seq[i].kind, (result) => {
        responses.illusions.push({ id: seq[i].key, isCorrect: result.isCorrect });
        i++; miniLoading(next);
      });
    }
    next();
  }

  function playerWeberBlock(onBlockDone) {
    function round(i) {
      if (i >= weberPairs.length) { onBlockDone(); return; }
      const pair = weberPairs[i];
      const swap = coin(); const ha = swap ? pair.b : pair.a; const hb = swap ? pair.a : pair.b;
      render(`<div class="card">${topProgress(globalOffset + i + 1)}<div class="progress">Rodada ${i + 1} de ${weberPairs.length}</div>
        <h1>Observe as barras</h1><div class="caption">Memorize as alturas — elas vão sumir.</div>
        <div class="stage-bars" id="bars">
          <div class="bar-wrap"><div class="bar" style="height:${ha}px"></div><div class="bar-label">A</div></div>
          <div class="bar-wrap"><div class="bar" style="height:${hb}px"></div><div class="bar-label">B</div></div>
        </div>
        <div class="btn-row"><button class="btn" id="sim" disabled>Havia diferença</button><button class="btn secondary" id="nao" disabled>Pareciam iguais</button></div>
      </div>`);
      setTimeout(() => {
        const barsEl = document.getElementById("bars"); if (!barsEl) return;
        barsEl.innerHTML = `<div class="bar-wrap"><div class="bar-placeholder"></div><div class="bar-label">A</div></div><div class="bar-wrap"><div class="bar-placeholder"></div><div class="bar-label">B</div></div>`;
        const s = document.getElementById("sim"), n = document.getElementById("nao");
        if (s) s.disabled = false; if (n) n.disabled = false;
      }, EXPOSICAO_BARRAS_MS);
      const record = (perceivedDifferent) => {
        const isCorrect = (perceivedDifferent && pair.correctType === "diferente") || (!perceivedDifferent && pair.correctType === "igual");
        responses.weber.push({ id: pair.id, isCorrect });
        miniLoading(() => round(i + 1));
      };
      attach("sim", () => record(true)); attach("nao", () => record(false));
    }
    round(0);
  }

  function playerNumerosityBlock(onBlockDone) {
    function round(i) {
      if (i >= numerosityPairs.length) { onBlockDone(); return; }
      const pair = numerosityPairs[i];
      const swap = pair.swap !== undefined ? pair.swap : coin(); const na = swap ? pair.b : pair.a; const nb = swap ? pair.a : pair.b;
      const correctSide = na === nb ? "igual" : (na > nb ? "A" : "B");
      render(`<div class="card">${topProgress(globalOffset + i + 1)}<div class="progress">Rodada ${i + 1} de ${numerosityPairs.length}</div>
        <h1>Observe os pontos</h1><div class="caption">Eles vão sumir — não dá tempo de contar.</div>
        <div class="dots-row" id="dotsrow"><div class="dots-box">${dotsSVG(na, 130, 130)}<div class="dots-label">A</div></div><div class="dots-box">${dotsSVG(nb, 130, 130)}<div class="dots-label">B</div></div></div>
        <div class="btn-row"><button class="btn" id="a" disabled>Grupo A</button><button class="btn" id="b" disabled>Grupo B</button><button class="btn secondary" id="igual" disabled>Pareciam iguais</button></div>
      </div>`);
      setTimeout(() => {
        const row = document.getElementById("dotsrow"); if (!row) return;
        row.style.opacity = "0";
        setTimeout(() => { if (row) { row.innerHTML = ""; row.style.opacity = "1"; } }, 200);
        ["a", "b", "igual"].forEach((id) => { const el = document.getElementById(id); if (el) el.disabled = false; });
      }, EXPOSICAO_PONTOS_MS);
      const record = (chosen) => {
        const isCorrect = chosen === correctSide;
        responses.numerosity.push({ id: pair.id, isCorrect });
        miniLoading(() => round(i + 1));
      };
      attach("a", () => record("A")); attach("b", () => record("B")); attach("igual", () => record("igual"));
    }
    round(0);
  }

  // ================= SEQUÊNCIA DE BLOCOS =================
  const EBB_ROUNDS = ratioSet5("ebb");
  // "pouco" 8% / "muito" 28%. Antes era 2% / 18%: 2% são ~1px, invisível — três das cinco
  // rodadas pareciam iguais e a pessoa não via as formas mudarem de tamanho.
  const JASTROW_ROUNDS = ratioSet5("jastrow", 1.08, 1.28);
  const VH_ROUNDS = comparativeSet5("vh", 150, 1.08, 1.3);
  const CONTRASTE_ROUNDS = comparativeSetAbs5("contraste", 130, 10, 25);
  const COR_ROUNDS = comparativeSetAbs5("cor", 0, 12, 28);
  const CB_REFS = CB_KINDS.map((k, i) => ({ key: `cegueira_${i}` }));
  const STROOP_REFS = [0, 1, 2, 3, 4, 5, 6].map((i) => ({ key: `stroop_${i}` }));

  // Resposta certa de cada rodada em função do lado sorteado — usada pelo planSequence.
  const ansSizeAB = (v, swap) => { const top = swap ? v.ratioB : v.ratioA, bot = swap ? v.ratioA : v.ratioB; return top === bot ? "igual" : (top > bot ? "A" : "B"); };
  const ansVH = (v) => (v.valA === v.valB ? "igual" : (v.valA > v.valB ? "vertical" : "horizontal"));
  const ansZollner = (v) => (v.val === 0 ? "paralelas" : "nao_paralelas");
  const ansGray = (v, swap) => { const l = swap ? v.valB : v.valA, r = swap ? v.valA : v.valB; return l === r ? "igual" : (l < r ? "esquerdo" : "direito"); };
  const ansWarm = (v, swap) => { const l = swap ? v.valB : v.valA, r = swap ? v.valA : v.valB; return l === r ? "igual" : (l > r ? "esquerdo" : "direito"); };
  // Blocos de 5 rodadas: nenhuma resposta repetida em sequência e A/B (ou esq./dir.) 2x cada.
  const PLAN_5 = (answerFn) => ({ answerFn, maxRun: 1, maxPerAnswer: 2 });

  const BLOCKS_ORDERED = [
    { title: "Tamanho", count: weberPairs.length, introSeconds: 2, objetivo: "Você vai ver duas barras verticais por menos de meio segundo, e depois elas somem da tela. Sua tarefa: dizer se as duas barras tinham a mesma altura, ou se uma era mais alta que a outra.", run: playerWeberBlock },
    { title: "Quantidade", count: numerosityPairs.length, introSeconds: 2, objetivo: "Você vai ver dois grupos de pontos por menos de um segundo, e depois eles somem. Sua tarefa: dizer qual grupo parecia ter mais pontos, ou se os dois grupos pareciam ter a mesma quantidade.", run: playerNumerosityBlock },
    { title: "Tamanho das formas", count: JASTROW_ROUNDS.length, introSeconds: 2, objetivo: "Você vai ver duas formas em arco, uma em cima da outra, por menos de um segundo antes de sumirem. Sua tarefa: dizer qual das duas formas parecia maior, ou se as duas pareciam do mesmo tamanho.", run: (onDone) => runSimpleBlock(JASTROW_ROUNDS, renderJastrow, onDone, PLAN_5(ansSizeAB)) },
    { title: "Tamanho de círculos", count: EBB_ROUNDS.length, introSeconds: 2, objetivo: "Dois grupos (rotulados A e B) vão aparecer em posições soltas na tela — cada um é um círculo azul cercado por outros círculos ao redor (o número, tamanho e posição desses círculos ao redor varia a cada rodada). Sua tarefa: dizer qual dos dois círculos azuis (do meio de cada grupo) parece maior, ou se os dois parecem do mesmo tamanho.", run: (onDone) => runSimpleBlock(EBB_ROUNDS, renderEbbinghaus, onDone, PLAN_5(ansSizeAB)) },
    { title: "Vertical x horizontal", count: VH_ROUNDS.length, introSeconds: 2, objetivo: "Você vai ver duas linhas formando um T: uma na vertical e uma na horizontal. Sua tarefa: dizer qual das duas linhas parece mais comprida, ou se as duas parecem do mesmo tamanho.", run: (onDone) => runSimpleBlock(VH_ROUNDS, renderVH, onDone, PLAN_5(ansVH)) },
    { title: "Linhas paralelas", count: ZOLLNER_ROUNDS.length, introSeconds: 2, objetivo: "Você vai ver duas linhas pretas na vertical, cada uma cruzada por pequenos traços diagonais. Sua tarefa: dizer se essas duas linhas pretas são paralelas entre si (ou seja, se apontam exatamente na mesma direção) ou não.", run: (onDone) => runSimpleBlock(ZOLLNER_ROUNDS, renderZollner, onDone, { answerFn: ansZollner, maxRun: 2, maxPerAnswer: 3 }) },
    { title: "Tons de cinza", count: CONTRASTE_ROUNDS.length, introSeconds: 2, objetivo: "Você vai ver dois quadrados cinzas pequenos, cada um no centro de um fundo diferente (um escuro, um claro). Sua tarefa: dizer qual dos dois quadrados cinzas parece mais escuro, ou se os dois parecem exatamente do mesmo tom.", run: (onDone) => runSimpleBlock(CONTRASTE_ROUNDS, renderContrasteSimultaneo, onDone, PLAN_5(ansGray)) },
    { title: "Tons de cor", count: COR_ROUNDS.length, introSeconds: 2, objetivo: "Você vai ver dois quadrados coloridos pequenos, cada um no centro de um fundo diferente (um azul, um amarelo). Sua tarefa: dizer qual dos dois quadrados parece ter uma cor mais quente (mais alaranjada), ou se as duas cores parecem iguais.", run: (onDone) => runSimpleBlock(COR_ROUNDS, renderContrasteCor, onDone, PLAN_5(ansWarm)) },
    { title: "Observação de cena", count: CB_KINDS.length, introSeconds: 2, objetivo: "Uma cena cheia de formas coloridas vai aparecer e piscar algumas vezes, rapidamente. Preste bastante atenção em cada forma individualmente. Quando ela parar de piscar, você vai apontar qual das formas mudou (de cor, tamanho ou posição, ou ficou mais fraca/apagada) — ou dizer que nada mudou.", run: runCegueiraBlock },
    {
      title: "Nomeação de cores", count: STROOP_REFS.length, introSeconds: 4,
      objetivo: "Uma palavra aparece na tela, escrita com tinta de uma cor — ignore o que ela diz. Clique no quadrado com a mesma cor da TINTA. Exemplo: palavra \"AZUL\" escrita em vermelho → clique no quadrado vermelho. Os quadrados aparecem 0,2s depois da palavra, e você tem 1 segundo pra responder.",
      run: runStroopBlock,
    },
  ];
  const BLOCKS = shuffle(BLOCKS_ORDERED); // ordem dos blocos sempre aleatória a cada partida
  const TOTAL_STEPS = BLOCKS.reduce((s, b) => s + b.count, 0);
  function topProgress(current) { const pct = Math.round((current / TOTAL_STEPS) * 100); return `<div class="topbar"><div class="topbar-fill" style="width:${pct}%"></div></div>`; }

  // O botão só aparece depois que o tempo termina — nada de avanço automático nem de
  // clique antecipado antes disso.
  function blockIntro(title, objetivo, blockNum, totalBlocks, introSeconds, onDone) {
    render(`<div class="card">
      <div class="badge">Etapa ${blockNum} de ${totalBlocks}</div>
      <h1>${title}</h1>
      <p class="lead">${objetivo}</p>
      <div class="topbar"><div class="topbar-fill" id="introTimer"></div></div>
      <p class="small" id="introCountdown" style="text-align:center; margin-top:6px;">Aguarde ${introSeconds}s…</p>
      <div class="btn-row" id="introBtnRow"></div>
    </div>`);
    const bar = document.getElementById("introTimer");
    if (bar) requestAnimationFrame(() => { bar.style.transition = `width ${introSeconds}s linear`; bar.style.width = "0%"; });
    let t = introSeconds;
    const timer = setInterval(() => {
      t -= 1;
      const el = document.getElementById("introCountdown");
      if (t > 0) { if (el) el.textContent = `Aguarde ${t}s…`; }
      else {
        clearInterval(timer);
        if (el) el.textContent = "Pronto!";
        const row = document.getElementById("introBtnRow");
        if (row) { row.innerHTML = `<button class="btn" id="startNow">Começar</button>`; attach("startNow", onDone); }
      }
    }, 1000);
  }

  function runBlockAt(i) {
    if (i >= BLOCKS.length) { playerFinish(); return; }
    const b = BLOCKS[i];
    blockIntro(b.title, b.objetivo, i + 1, BLOCKS.length, b.introSeconds || 2, () => {
      b.run(() => { globalOffset += b.count; if (i + 1 < BLOCKS.length) saveProgress(false); runBlockAt(i + 1); });
    });
  }

  // Salva (ou atualiza) a linha desta partida no Supabase. Chamado ao iniciar, ao fim de
  // cada bloco e ao terminar (finished = true), pra o painel mostrar quem está jogando
  // em tempo real. A rodada é fixada no início da partida: se o professor clicar em
  // "Nova rodada" no meio, este aluno continua gravando na rodada em que começou.
  let gameRoundId = null;
  async function saveProgress(finished) {
    try {
      if (!gameRoundId) gameRoundId = await ensureRoundId();
      const { error } = await sb.from("responses").upsert({
        session_id: sessionId,
        round_id: gameRoundId,
        student_name: studentName,
        weber: responses.weber,
        numerosity: responses.numerosity,
        illusions: responses.illusions,
        duration_ms: startedAt ? Date.now() - startedAt : 0,
        finished: !!finished,
      }, { onConflict: "session_id,round_id" });
      if (error) throw error;
      return true;
    } catch (e) { console.warn("saveProgress falhou:", e); return false; }
  }
  // Nomes digitados pelos alunos vão parar em innerHTML (painel e resultado): escapar.
  function esc(t) { return String(t == null ? "" : t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

  function askStudentName() {
    render(`<div class="card"><div class="badge">🧠 Lab. Sensação e Percepção</div><h1>Antes de começar</h1>
      <p class="lead">Digite seu nome — é assim que o professor vai identificar sua pontuação no painel da turma.</p>
      <input class="text-input" id="nameInput" type="text" placeholder="Seu nome" autocomplete="off">
      <p class="small" id="nameError" style="color:#dc2626; display:none; margin-top:-8px; margin-bottom:10px;">Digite seu nome pra continuar.</p>
      <div class="btn-row"><button class="btn" id="nameGo">Começar</button></div></div>`);
    const submit = () => {
      const input = document.getElementById("nameInput");
      const val = input.value.trim();
      if (!val) { document.getElementById("nameError").style.display = "block"; return; }
      studentName = val;
      playerWelcome();
    };
    attach("nameGo", submit);
    const input = document.getElementById("nameInput");
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
    input.focus();
  }

  function playerWelcome() {
    render(`<div class="card"><div class="badge">🧠 Lab. Sensação e Percepção</div><h1 style="font-size:26px; background:linear-gradient(135deg,#06b6d4,#8b5cf6,#ec4899); -webkit-background-clip:text; background-clip:text; color:transparent;">Você confia no que vê?</h1>
      <p class="lead">Oi, <b>${esc(studentName)}</b>! Você vai passar por ${BLOCKS.length} etapas curtas. Antes de cada uma, o objetivo será explicado com clareza.</p>
      <div class="btn-row"><button class="btn" id="go">Começar o jogo</button></div></div>`);
    attach("go", async () => { startedAt = Date.now(); await saveProgress(false); runBlockAt(0); });
  }

  // ---------------- RESULTADO PESSOAL ----------------
  function scoreOf(list) { return { correct: list.filter((x) => x.isCorrect).length, total: list.length }; }
  function fmtDuration(ms) {
    const totalSec = Math.max(0, Math.round(ms / 1000));
    const m = Math.floor(totalSec / 60), s = totalSec % 60;
    return m > 0 ? `${m}min ${s}s` : `${s}s`;
  }
  // Cada bloco é identificado pelo prefixo das chaves que ele grava em
  // responses.illusions (ex.: "jastrow_", "stroop_"), pra poder separar o placar
  // pessoal por jogo sem precisar mudar todos os pontos que registram resposta.
  const BLOCK_PREFIXES = [
    { title: "Tamanho", source: "weber" },
    { title: "Quantidade", source: "numerosity" },
    { title: "Tamanho das formas", prefix: "jastrow_" },
    { title: "Tamanho de círculos", prefix: "ebb_" },
    { title: "Vertical x horizontal", prefix: "vh_" },
    { title: "Linhas paralelas", prefix: "zollner_" },
    { title: "Tons de cinza", prefix: "contraste_" },
    { title: "Tons de cor", prefix: "cor_" },
    { title: "Observação de cena", prefix: "cegueira_" },
    { title: "Nomeação de cores", prefix: "stroop_" },
  ];
  // Placar por jogo a partir das listas de respostas (do aluno ou vindas do banco).
  function gameScores(weber, numerosity, illusions) {
    return BLOCK_PREFIXES.map((b) => {
      const list = b.source === "weber" ? weber : b.source === "numerosity" ? numerosity
        : illusions.filter((x) => x && typeof x.id === "string" && x.id.startsWith(b.prefix));
      return { title: b.title, ...scoreOf(list) };
    });
  }
  function perGameScores() { return gameScores(responses.weber, responses.numerosity, responses.illusions); }
  function pctOf(correct, total) { return total ? Math.round((correct / total) * 100) : null; }

  async function playerFinish() {
    render(`<div class="card"><h1>Calculando seu resultado...</h1><p class="lead">Só um instante.</p></div>`);
    const durationMs = startedAt ? Date.now() - startedAt : 0;
    const perGame = perGameScores();
    const totalCorrect = perGame.reduce((s, g) => s + g.correct, 0);
    const totalQuestions = perGame.reduce((s, g) => s + g.total, 0);
    await saveProgress(true);
    const painelHref = (() => { const u = new URL(window.location.href); u.searchParams.set("painel", "1"); return u.toString(); })();
    render(`<div class="card"><h1 style="font-size:26px; background:linear-gradient(135deg,#06b6d4,#8b5cf6,#ec4899); -webkit-background-clip:text; background-clip:text; color:transparent;">🎉 Seu resultado, ${esc(studentName)}</h1>
      <p class="lead" style="margin-bottom:4px">Você acertou <b>${totalCorrect} de ${totalQuestions}</b> rodadas.</p>
      <p class="lead" style="margin-bottom:8px; font-size:13px;">Tempo total: <b>${fmtDuration(durationMs)}</b></p>
      ${perGame.map((g) => `<div class="score-row"><span>${g.title}</span><b>${g.correct}/${g.total} · ${pctOf(g.correct, g.total) ?? 0}%</b></div>`).join("")}
      <p class="lead" style="margin-top:16px; font-size:13px;">Suas respostas foram enviadas para o placar da turma.</p>
      <a class="linklike" href="${painelHref}" target="_blank" rel="noopener">Ver o painel ao vivo da turma →</a>
    </div>`);
  }

  // ---------------- PAINEL (APRESENTADOR) ----------------
  let pollTimer = null;
  async function ensureRoundId() {
    try {
      const { data, error } = await sb.from("game_state").select("current_round_id").eq("id", 1).maybeSingle();
      if (error) throw error;
      if (data && data.current_round_id) return data.current_round_id;
      return await newRound();
    } catch (e) { return await newRound(); }
  }
  async function newRound() {
    const id = "r" + Date.now();
    await sb.from("game_state").upsert({ id: 1, current_round_id: id, updated_at: new Date().toISOString() });
    return id;
  }

  // O QR code precisa sobreviver ao refresh de 3s do painel (render() troca o HTML todo).
  let qrLink = null;
  function drawQr() {
    const box = document.getElementById("qrbox");
    if (!box || !qrLink) return;
    box.innerHTML = "";
    new QRCode(box, { text: qrLink, width: 180, height: 180 });
  }
  function pctTint(pct) {
    if (pct === null) return "transparent";
    if (pct >= 70) return "rgba(22,163,74,0.16)";
    if (pct >= 40) return "rgba(245,158,11,0.20)";
    return "rgba(220,38,38,0.14)";
  }

  async function renderPainel() {
    const roundId = await ensureRoundId();
    let allResp = [];
    try {
      const { data, error } = await sb.from("responses").select("*").eq("round_id", roundId).order("created_at", { ascending: true });
      if (error) throw error;
      allResp = data || [];
    } catch (e) { /* sem respostas ainda */ }

    const rows = allResp.map((r) => {
      const games = gameScores(r.weber || [], r.numerosity || [], r.illusions || []);
      return { name: r.student_name || "(sem nome)", games, totalCorrect: games.reduce((s, g) => s + g.correct, 0), createdAt: r.created_at || "", finished: !!r.finished };
    }).sort((a, b) => (b.totalCorrect - a.totalCorrect) || a.createdAt.localeCompare(b.createdAt));
    const playingNow = rows.filter((p) => !p.finished).length;

    // Acerto da turma por jogo: soma de acertos / soma de respostas dadas naquele jogo.
    const classAgg = BLOCK_PREFIXES.map((_, gi) => rows.reduce((acc, r) => ({ correct: acc.correct + r.games[gi].correct, total: acc.total + r.games[gi].total }), { correct: 0, total: 0 }));

    const head = `<tr><th class="name-col">Nome</th>${BLOCK_PREFIXES.map((b) => `<th>${b.title}</th>`).join("")}</tr>`;
    const classRow = `<tr class="class-row"><td class="name-col">Turma</td>${classAgg.map((g) => {
      const pct = pctOf(g.correct, g.total);
      return pct === null ? `<td class="pcell">—</td>` : `<td class="pcell"><b>${pct}%</b><span>${g.correct}/${g.total}</span></td>`;
    }).join("")}</tr>`;
    const body = rows.map((r) => `<tr><td class="name-col">${esc(r.name)}</td>${r.games.map((g) => {
      const pct = pctOf(g.correct, g.total);
      return pct === null ? `<td class="pcell">—</td>` : `<td class="pcell" style="background:${pctTint(pct)}"><b>${g.correct}/${g.total}</b><span>${pct}%</span></td>`;
    }).join("")}</tr>`).join("");

    render(`<div class="card" style="max-width:1180px; text-align:left; min-height:auto;">
      <h2 style="text-align:center">Painel do apresentador</h2><h1 style="text-align:center">Placar ao vivo — ${rows.length} participante(s)</h1>
      <p class="small" style="text-align:center; margin-bottom:12px">${playingNow} jogando agora · ${rows.length - playingNow} terminaram</p>
      <div class="btn-row" style="justify-content:space-between"><button class="btn secondary" id="reset">Nova rodada (zera respostas)</button><button class="btn secondary" id="qr">Gerar QR code do link</button></div>
      <div id="qrbox"></div>
      ${rows.length ? `<div class="table-scroll"><table class="score-table"><thead>${head}</thead><tbody>${classRow}${body}</tbody></table></div>` : `<p class="small" style="margin-top:16px">Ninguém respondeu ainda nesta rodada.</p>`}
    </div>`);
    document.getElementById("reset").addEventListener("click", async () => { await newRound(); renderPainel(); });
    document.getElementById("qr").addEventListener("click", () => { qrLink = window.location.href.split("?")[0]; drawQr(); });
    drawQr();
  }
  function startPainel() { renderPainel(); pollTimer = setInterval(renderPainel, 3000); }

  if (isPainel) startPainel(); else askStudentName();
})();
</script>
</body>
</html>
